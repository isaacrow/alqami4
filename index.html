    <!-- Google Fonts: Amiri, Cairo, Tajawal, Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@300;400;600;700;900&family=Outfit:wght@300;400;500;600;700;800&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">

    <script type="module" src="./js/model-viewer.min.js"></script>
    <script type="module" crossorigin src="./assets/index-DNIauWVI.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-xSqJlls2.css">
  </head>
  <body class="bg-black text-white selection:bg-white/20 selection:text-white antialiased overflow-x-hidden min-h-screen">
    
    <!-- SVG Liquid Glass Refraction Filters -->
    <svg style="position: absolute; width: 0; height: 0; pointer-events: none;" aria-hidden="true">
      <defs>
        <!-- Frosted Glass Distortion Filter -->
        <filter id="frosted" primitiveUnits="objectBoundingBox">
          <feTurbulence type="fractalNoise" baseFrequency="0.04 0.04" numOctaves="3" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.03" xChannelSelector="R" yChannelSelector="G" result="displaced" />
          <feGaussianBlur in="displaced" stdDeviation="0.008" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" opacity="0.15" />
          </feMerge>
        </filter>

        <!-- Liquid Glass Curvature Filter -->
        <filter id="glass-distortion" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="turbulence" baseFrequency="0.015" numOctaves="2" result="turb" />
          <feDisplacementMap in="SourceGraphic" in2="turb" scale="12" xChannelSelector="R" yChannelSelector="G" result="disp" />
        </filter>

        <!-- Specular Edge Shimmer -->
        <linearGradient id="liquid-shine" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="rgba(255,255,255,0.7)" />
          <stop offset="25%" stop-color="rgba(255,255,255,0.15)" />
          <stop offset="60%" stop-color="rgba(255,255,255,0.02)" />
          <stop offset="100%" stop-color="rgba(255,255,255,0.3)" />
        </linearGradient>
      </defs>
    </svg>

    <div id="root"></div>
  </body>
